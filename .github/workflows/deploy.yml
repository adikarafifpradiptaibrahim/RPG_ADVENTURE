name: Deploy Antigravity Web to Server

on:
  push:
    branches:
      - main  # Otomatis jalan setiap ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: srvgame.banteng-sargas.ts.net
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/git
            git remote set-url origin https://github.com/adikarafifpradiptaibrahim/RPG_ADVENTURE.git
            git fetch origin main
            git reset --hard origin/main
            npm install
            NODE_OPTIONS="--max-old-space-size=2048" npm run build
            pm2 restart 0 --update-env